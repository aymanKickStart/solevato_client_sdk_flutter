name: solevato_client_sdk_flutter
description: A flutter client sdk for solevato. Integrate Solevato flutter client into your flutter app and talk to your visitors/users in real time.
version: 0.0.8
homepage: https://bitbucket.com/markrady/solevato-flutter-sdk

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_chat_ui: ^1.1.9
  hive: ^2.0.4
  hive_flutter: ^1.1.0
  uuid: ^3.0.4
  web_socket_channel: ^2.1.0
  json_annotation: ^4.0.1
  dio: ^4.0.0
  equatable: ^2.0.3
  riverpod: ^0.14.0+3
  synchronized: ^3.0.0
  intl: ^0.17.0
  flutter_chat_types: ^2.4.0
  stream_channel: ^2.1.0
  async: ^2.5.0
  package_info_plus: ^1.4.2
  url_launcher: ^6.1.8
  pinch_zoom: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.7
  json_serializable: ^4.1.1
  hive_generator: ^1.1.2
  build_runner: ^2.0.6
  flutter_lints: ^1.0.4

# The following section is specific to Flutter.
flutter:

  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/
