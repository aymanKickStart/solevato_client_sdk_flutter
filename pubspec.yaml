name: solevato_client_sdk_flutter
description: A flutter client sdk for solevato. Integrate Solevato flutter client into your flutter app and talk to your visitors/users in real time.
version: 0.0.10
homepage: https://bitbucket.com/markrady/solevato-flutter-sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_chat_ui: ^1.1.9
  hive: ^2.0.4
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
  json_annotation: ^4.0.1
  dio: ^5.8.0+1
  equatable: ^2.0.3
  riverpod: ^2.6.1
  synchronized: ^3.0.0
  intl: ^0.20.2
  flutter_chat_types: ^3.6.2
  stream_channel: ^2.1.0
  async: ^2.5.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.1.8
  pinch_zoom: ^2.0.1
  flutter_link_previewer: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.7
  json_serializable: ^6.8.0   # ⬅️ downgrade to fix analyzer/macro conflict
  hive_generator: ^2.0.1
  build_runner: ^2.4.11       # ⬅️ latest compatible with Dart 3.5
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/
